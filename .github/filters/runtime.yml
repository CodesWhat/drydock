runtime:
  - 'app/**'
  - 'ui/**'
  - 'e2e/**'
  - 'test/**'
  - 'scripts/**'
  - 'Dockerfile'
  - 'Docker.entrypoint.sh'
  - 'healthcheck.c'
  - 'package.json'
  - 'package-lock.json'
  # The Grype gate reads this, so a change to it has to re-run the scan that
  # consumes it. Without this line a PR that only edits ignore rules skips
  # `grype-image` entirely and merges without CI ever exercising the new
  # rules — which is exactly what happened on the CVE-2026-14456 change.
  # The cost is that a .grype.yaml edit also triggers the e2e suites sharing
  # this filter. That's accepted: these edits are rare, and the alternative
  # is a separate filter output for one file.
  - '.grype.yaml'
  - '.github/filters/runtime.yml'
  - '.github/workflows/ci-verify.yml'
  - '.github/workflows/e2e-playwright.yml'

# The marketing/docs site (apps/web) deploys via Vercel, not the Docker image,
# so it's separate from the `runtime` gate above. Its `node --test` scripts suite
# is what Vercel never runs — the `web` job below gates it. content/docs is
# included because sync-docs pulls it into the build.
web:
  - 'apps/web/**'
  - 'content/docs/**'
