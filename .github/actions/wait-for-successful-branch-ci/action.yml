name: Wait For Successful Branch CI
description: Resolve a workflow by file name and wait for a successful branch push run on a target SHA

inputs:
  github-token:
    description: GitHub token with actions read access
    required: true
  workflow-file:
    description: Workflow file name to resolve, for example ci-verify.yml
    required: true
  target-sha:
    description: Commit SHA that must have a successful branch push run
    required: true
  max-attempts:
    description: Maximum polling attempts before timing out
    required: false
    default: '12'
  sleep-seconds:
    description: Seconds to sleep between polling attempts
    required: false
    default: '300'
  allow-dispatch-events:
    description: >-
      Also accept workflow_dispatch-triggered runs as CI evidence, not just push
      runs. Maintenance cuts only: a named dev branch's push trigger only covers
      main, so a maintenance-branch SHA can never have a qualifying push run —
      the CI evidence there is a workflow_dispatch run instead. Leave 'false' for
      normal cuts, where it is a no-op.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Resolve workflow reference
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        WORKFLOW_FILE: ${{ inputs.workflow-file }}
      run: |
        set -euo pipefail

        workflow_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_FILE}"
        workflow_json="$(curl -fsSL \
          -H "Authorization: Bearer ${GH_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          "${workflow_url}")"

        workflow_id="$(echo "${workflow_json}" | jq -r '.id // empty')"
        workflow_name="$(echo "${workflow_json}" | jq -r '.name // empty')"
        workflow_path="$(echo "${workflow_json}" | jq -r '.path // empty')"
        if [ -z "${workflow_id}" ] || [ -z "${workflow_path}" ]; then
          echo "::error::Failed to resolve workflow metadata for ${WORKFLOW_FILE}."
          exit 1
        fi

        {
          echo "workflow_id=${workflow_id}"
          echo "workflow_name=${workflow_name}"
          echo "workflow_path=${workflow_path}"
        } >> "$GITHUB_ENV"
        echo "Using CI verification workflow: ${workflow_name} (${workflow_path}, id=${workflow_id})"

    - name: Wait for successful branch CI on target SHA
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        TARGET_SHA: ${{ inputs.target-sha }}
        MAX_ATTEMPTS: ${{ inputs.max-attempts }}
        SLEEP_SECONDS: ${{ inputs.sleep-seconds }}
        ALLOW_DISPATCH_EVENTS: ${{ inputs.allow-dispatch-events }}
      run: |
        set -euo pipefail

        for attempt in $(seq 1 "${MAX_ATTEMPTS}"); do
          # GitHub's `?head_sha=` and `?event=` query filters on this endpoint
          # have been spuriously returning 0 results since 2026-04-27 (the
          # unfiltered endpoint still returns the runs fine). Pull the latest
          # 100 runs unfiltered and filter client-side via jq for resilience.
          runs_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?per_page=100"
          runs_json="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${runs_url}")"

          # Normal cuts only accept push-triggered runs: ci-verify.yml's push
          # trigger covers main only, so a main-HEAD SHA always has one to find.
          # Maintenance cuts build from a named dev branch, which push never
          # covers, so allow-dispatch-events also accepts workflow_dispatch runs
          # there — the CI-green precondition a human confirmed by manually
          # dispatching ci-verify.yml/e2e-playwright.yml on that branch first.
          filtered="$(echo "${runs_json}" | jq --arg sha "${TARGET_SHA}" --arg allowDispatch "${ALLOW_DISPATCH_EVENTS}" '{
            workflow_runs: [.workflow_runs[]
              | select(.head_sha == $sha
                  and (.event == "push" or ($allowDispatch == "true" and .event == "workflow_dispatch"))
                  and ((.head_branch // "") | length > 0))]
          }')"

          success_count="$(echo "${filtered}" | jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          in_progress_count="$(echo "${filtered}" | jq '[.workflow_runs[] | select(.status != "completed")] | length')"
          completed_count="$(echo "${filtered}" | jq '[.workflow_runs[] | select(.status == "completed")] | length')"

          if [ "${success_count}" -gt 0 ]; then
            echo "Found successful ${workflow_name} branch push run for ${TARGET_SHA}."
            exit 0
          fi

          if [ "${completed_count}" -gt 0 ] && [ "${in_progress_count}" -eq 0 ]; then
            echo "::error::${workflow_name} branch push runs for ${TARGET_SHA} completed without success."
            echo "${filtered}" | jq '.workflow_runs[] | {id, status, conclusion, head_branch, html_url}'
            exit 1
          fi

          echo "Attempt ${attempt}/${MAX_ATTEMPTS}: waiting for successful ${workflow_name} branch push run on ${TARGET_SHA}..."
          if [ "${attempt}" -lt "${MAX_ATTEMPTS}" ]; then
            sleep "${SLEEP_SECONDS}"
          fi
        done

        echo "::error::Timed out waiting for successful ${workflow_name} branch push run on ${TARGET_SHA}."
        exit 1
