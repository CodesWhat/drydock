name: "🏷️ Release: Cut"
run-name: "🏷️ Release: Cut — manual by ${{ github.actor }}"

# Recoverable release pipeline. Build output is first published under
# run-scoped staging tags, signed, attested, and attached to a draft release.
# User-facing image tags, the git tag, and the GitHub release are finalized in
# that order by idempotent steps. A retry can safely finish a partial cut.
# GA releases never rebuild: they promote an exact seven-day-old RC digest and
# tag the exact RC source commit.
#
# BEFORE DISPATCHING (local pre-cut step — cannot run in CI):
#   npm run release:precheck <tag>     # e.g. npm run release:precheck v1.6.0
# Surfaces open Discussions still owed a "shipped in <version>" reply, read from
# .planning/roadmap/current-tracker.md (gitignored — invisible to this runner,
# which is why it is a local gate, not a job here). Exits non-zero on a GA tag
# with pending replies; --force to bypass. Post the replies + tick the boxes,
# then dispatch this workflow.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to cut, e.g. v1.5.0-rc.17 or v1.5.0. Tag base must match package.json version and the tag must not already exist."
        required: true
        type: string
      candidate_tag:
        description: "GA only: exact prerelease tag to promote, e.g. v1.6.0-rc.3. Must be at least seven full days old."
        required: false
        type: string
      candidate_digest:
        description: "GA only: exact sha256 digest published by candidate_tag in GHCR, Docker Hub, and Quay."
        required: false
        type: string
      soak_override_reason:
        description: "GA only: reason for shortening the seven-day soak on candidate_tag. Leave blank to enforce the full seven-day soak — this is the default and expected path. A non-empty value is permanently recorded in the run summary and in the published release notes."
        required: false
        type: string
        default: ""
      source_ref:
        description: "Maintenance cuts only: dev branch to build from (e.g. dev/v1.6) when cutting a patch for a line main has moved past. Leave empty for normal cuts."
        required: false
        type: string
        default: ""

permissions: {}

concurrency:
  group: release-cut
  cancel-in-progress: false

env:
  DOCKER_PLATFORMS: linux/amd64,linux/arm64
  CI_VERIFY_WORKFLOW_FILE: ci-verify.yml
  E2E_PLAYWRIGHT_WORKFLOW_FILE: e2e-playwright.yml

jobs:
  release:
    name: "🚀 Release: Build, Publish, Tag"
    runs-on: ubuntu-24.04
    timeout-minutes: 120  # Multi-arch build, signing, attestations, release upload, and CI-success polling budget
    environment: release-publish
    env:
      DOCKERHUB_REPO: docker.io/codeswhat/drydock
      QUAY_REPO: quay.io/codeswhat/drydock
    permissions:
      contents: write      # git push tag, gh release create
      packages: write      # ghcr push
      id-token: write      # cosign keyless signing
      attestations: write  # attest-build-provenance + OCI attestation storage
      actions: write       # wait-for-successful-branch-ci queries workflow runs; also dispatch starchart refresh (write implies read)

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit

      - name: Assert dispatched from main
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "${GIT_REF}" != "refs/heads/main" ]; then
            echo "::error::release-cut must be dispatched from refs/heads/main, got ${GIT_REF}. The cosign OIDC identity is pinned to main."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Validate maintenance source_ref input
        id: source_ref
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail

          if [ -z "${SOURCE_REF}" ]; then
            {
              echo "is_maintenance_cut=false"
              echo "source_branch="
            } >> "$GITHUB_OUTPUT"
            echo "No source_ref supplied; normal cut from main."
            exit 0
          fi

          # Anti-footgun bound: only a dev/vX.Y branch name, never an arbitrary
          # ref (mirrors the i18n translation-base resolver's own dev/vX.Y bound).
          if ! [[ "${SOURCE_REF}" =~ ^dev/v[0-9]+\.[0-9]+$ ]]; then
            echo "::error::source_ref '${SOURCE_REF}' is not in the required 'dev/vX.Y' form (e.g. dev/v1.6)."
            exit 1
          fi

          # release_tag's vX.Y line must match source_ref's line: v1.6.1 from
          # dev/v1.6 is a maintenance cut; v1.7.0 from dev/v1.6 is nonsense.
          tag_line="$(printf '%s' "${RELEASE_TAG}" | sed -E 's/^v?([0-9]+)\.([0-9]+)\..*/\1.\2/')"
          source_line="${SOURCE_REF#dev/v}"
          if [ "${tag_line}" != "${source_line}" ]; then
            echo "::error::release_tag '${RELEASE_TAG}' is on line ${tag_line}, but source_ref '${SOURCE_REF}' is line ${source_line}. The tag's vX.Y line must match source_ref's line."
            exit 1
          fi

          # source_ref must actually exist on origin.
          dev_branches="$(git ls-remote --heads origin 'refs/heads/dev/v*' \
            | sed 's#.*refs/heads/##' \
            | { grep -E '^dev/v[0-9]+\.[0-9]+$' || true; })"
          if [ -z "${dev_branches}" ]; then
            echo "::error::Could not list any dev/vX.Y branch on origin to validate source_ref."
            exit 1
          fi
          if ! grep -qxF "${SOURCE_REF}" <<< "${dev_branches}"; then
            echo "::error::source_ref '${SOURCE_REF}' does not exist as a branch on origin."
            exit 1
          fi

          # Must not be the active line. The active line is derived from
          # main's own package.json version (this job already has main checked
          # out here), NOT from "the highest dev/vX.Y branch name on origin" —
          # that branch namespace is writable by anyone with push access, so a
          # stray or decoy branch (dev/v999.0, or even an innocently early
          # dev/v1.8 cut before main's version bump lands) would silently
          # relabel the true active line as "not highest" and let a
          # would-be-normal cut skip the drift guard by masquerading as a
          # maintenance one. package.json's version only changes via an actual
          # commit, so it can't be gamed by creating a branch.
          main_version="$(jq -r '.version // empty' package.json)"
          if [ -z "${main_version}" ]; then
            echo "::error::Could not read .version from package.json on main to determine the active line."
            exit 1
          fi
          main_line="$(printf '%s' "${main_version}" | sed -E 's/^([0-9]+)\.([0-9]+)\..*/\1.\2/')"
          if [ "${source_line}" = "${main_line}" ]; then
            echo "::error::${SOURCE_REF} matches main's active line (package.json version ${main_version}). This is not a maintenance cut — leave source_ref empty and cut from main."
            exit 1
          fi

          # Patch component must be nonzero: maintenance cuts are for patch
          # releases (vX.Y.Z, Z>0, GA or prerelease alike) — v1.6.0 or
          # v1.6.0-rc.N is a new minor line and belongs on main, never on a
          # retired dev branch.
          patch="$(printf '%s' "${RELEASE_TAG}" | sed -E 's/^v?[0-9]+\.[0-9]+\.([0-9]+).*/\1/')"
          if [ "${patch}" -eq 0 ]; then
            echo "::error::release_tag '${RELEASE_TAG}' has patch version 0. Maintenance cuts (source_ref) are for patch releases (vX.Y.Z with Z>0); cut vX.Y.0 from main normally."
            exit 1
          fi

          {
            echo "is_maintenance_cut=true"
            echo "source_branch=${SOURCE_REF}"
          } >> "$GITHUB_OUTPUT"
          echo "Maintenance cut validated: ${RELEASE_TAG} from ${SOURCE_REF} (main's active line is ${main_line})."

      - name: Assert main is in sync with the active dev branch
        if: steps.source_ref.outputs.is_maintenance_cut != 'true'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          # main is never an independent commit target: it only advances by merging from
          # dev/vX.Y before a cut. If a fix landed straight on main, main holds work the
          # integration branch never got and the next dev merge silently reverts it. That
          # is exactly how v1.6 drifted (rc.3-rc.5 fixes on main, dev 112 files behind).
          #
          # Compare TREES, not commit ancestry: this repo allows squash merges only, so
          # every dev -> main sync mints a commit dev lacks and an ancestry check would
          # always fail. Identical trees is the real invariant.
          minor="$(printf '%s' "${RELEASE_TAG}" | sed -E 's/^v?([0-9]+)\.([0-9]+)\..*/\1.\2/')"
          dev_branch="dev/v${minor}"
          # Separate "branch is absent" from "we could not ask". --exit-code collapses
          # both into a non-zero status, so a network blip or auth failure would take the
          # skip path and let a drifted main be tagged. Empty output on a successful query
          # is the only thing that means the branch is genuinely gone.
          if ! refs="$(git ls-remote --heads origin "refs/heads/${dev_branch}")"; then
            echo "::error::Could not query origin for ${dev_branch}. Refusing to skip the drift check on an unanswered question."
            exit 1
          fi
          if [ -z "${refs}" ]; then
            echo "No ${dev_branch} on origin (retired after GA, or not yet created) — nothing to compare."
            exit 0
          fi
          git fetch --quiet origin "${dev_branch}"
          if ! git diff --quiet HEAD "origin/${dev_branch}"; then
            echo "::error::main has drifted from ${dev_branch}. Cutting now would ship content ${dev_branch} never received, or miss content it has. Forward-port first, then re-dispatch."
            git diff --stat HEAD "origin/${dev_branch}" | tail -25
            exit 1
          fi
          echo "main is in sync with ${dev_branch} (identical trees)."

          # Renovate names exactly one base branch (a pattern would expand to every
          # matching dev/vX.Y and double every dependency PR), so it has to be rotated
          # at each branch cut. This is the one moment the correct value is known, so
          # a stale target fails here instead of quietly aiming the bot at a dead
          # branch until someone "fixes" it by pointing the PRs back at main.
          renovate_base="$(jq -r '.baseBranchPatterns // .baseBranches // [] | join(",")' renovate.json)"
          if [ "${renovate_base}" != "${dev_branch}" ]; then
            echo "::error::renovate.json targets '${renovate_base}' but this cut is for ${dev_branch}. Update baseBranchPatterns to [\"${dev_branch}\"] and re-dispatch."
            exit 1
          fi
          echo "renovate.json targets ${dev_branch}."

      - name: Resolve target SHA and lowercase repository
        id: target
        env:
          IS_MAINTENANCE_CUT: ${{ steps.source_ref.outputs.is_maintenance_cut }}
          SOURCE_BRANCH: ${{ steps.source_ref.outputs.source_branch }}
        run: |
          set -euo pipefail
          if [ "${IS_MAINTENANCE_CUT}" = "true" ]; then
            # Maintenance cut: build from the named dev branch's tip, not main
            # HEAD. The job still runs at refs/heads/main (asserted above and
            # checked out here) — this only changes which tree gets built and
            # released, not the workflow run's own ref, which is what the
            # cosign OIDC identity is pinned to.
            #
            # Fetch into an EXPLICIT remote-tracking ref and resolve THAT exact
            # path, not the "origin/${SOURCE_BRANCH}" shorthand: gitrevisions'
            # disambiguation order checks refs/tags/<name> and refs/heads/<name>
            # before refs/remotes/<name>, so a tag someone pushed literally
            # named "origin/dev/v1.6" would silently outrank the real
            # remote-tracking branch and get built, signed, and tagged instead
            # — `git rev-parse` only warns "ambiguous", it does not fail.
            # `refs/remotes/origin/${SOURCE_BRANCH}` is a fully qualified path,
            # so it is looked up directly with no shorthand search at all.
            git fetch --quiet origin "refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}"
            sha="$(git rev-parse --verify --end-of-options "refs/remotes/origin/${SOURCE_BRANCH}^{commit}")"
          else
            sha="$(git rev-parse HEAD)"
          fi
          # Docker registries reject uppercase repository names. ${GITHUB_REPOSITORY}
          # preserves the org casing (e.g. "CodesWhat/drydock") so we expose a
          # pre-lowered value for every step that builds an image reference.
          repo_lower="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "sha=${sha}"
            echo "repo_lower=${repo_lower}"
          } >> "$GITHUB_OUTPUT"
          echo "Target SHA: ${sha}"
          echo "Repository (lowercase): ${repo_lower}"

      - name: Capture CHANGELOG snapshot from target SHA
        id: target_changelog
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          # Defect: GA promotes a seven-day-old RC candidate whose checked-out
          # tree (after "Checkout exact release source" below) can only ever
          # contain "## [X.Y.Z-rc.N] - ..." headings — each RC promotes
          # [Unreleased] to its own rc heading at prep time, and the GA heading
          # "## [X.Y.Z] - ..." is not added to CHANGELOG.md until GA day, on
          # main, AFTER the candidate was already tagged. Reading CHANGELOG.md
          # out of the detached candidate checkout therefore can never find the
          # GA entry — both changelog-reading steps below would deterministically
          # fail on every possible GA dispatch. They must instead read
          # CHANGELOG.md as it exists at TARGET_SHA (this run's dispatch-time
          # main HEAD), which is where the GA heading actually lives.
          #
          # For prereleases SOURCE_SHA == TARGET_SHA, so this is behavior-neutral
          # there — same file, same content, just read one commit earlier than
          # the detached checkout that follows.
          #
          # `git show SHA:path` reads the blob straight out of the object
          # database and needs no checkout of that SHA, so this is safe to run
          # here (before "Checkout exact release source") or after — the
          # earlier checkout step fetched full history (fetch-depth: 0), so the
          # TARGET_SHA tree's objects are already present either way.
          changelog_path="${RUNNER_TEMP}/target-sha-changelog.md"
          git show "${TARGET_SHA}:CHANGELOG.md" > "${changelog_path}"
          echo "path=${changelog_path}" >> "$GITHUB_OUTPUT"
          # Snapshot the extractor script too, for the same reason: at GA the
          # working tree is the candidate's seven-day-old checkout, so running
          # its scripts/extract-changelog-entry.mjs against main's CHANGELOG
          # would pair main's data with stale parser code. Pin both to
          # TARGET_SHA so a parser fix that lands on main during the soak is
          # the code that actually parses main's file.
          #
          # The whole scripts/ tree is extracted (not a single-file `git show`)
          # because the extractor imports relative siblings — e.g.
          # ./lib/parse-args.mjs — and Node resolves those against the script's
          # own location, so a lone copied file dies with ERR_MODULE_NOT_FOUND.
          scripts_snapshot_dir="${RUNNER_TEMP}/target-sha-scripts"
          mkdir -p "${scripts_snapshot_dir}"
          git archive "${TARGET_SHA}" scripts | tar -x -C "${scripts_snapshot_dir}"
          extract_script_path="${scripts_snapshot_dir}/scripts/extract-changelog-entry.mjs"
          test -f "${extract_script_path}"
          echo "extract_script=${extract_script_path}" >> "$GITHUB_OUTPUT"

      - name: Resolve release tag from input
        id: next
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if ! [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release_tag '${RELEASE_TAG}'. Expected vX.Y.Z or vX.Y.Z-prerelease (e.g. v1.5.0 or v1.5.0-rc.17)."
            exit 1
          fi

          next_version="${RELEASE_TAG#v}"
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            release_level="prerelease"
          else
            release_level="release"
          fi

          {
            echo "release_level=${release_level}"
            echo "next_version=${next_version}"
            echo "release_tag=${RELEASE_TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Parse release tag
        id: tag
        env:
          RELEASE_TAG: ${{ steps.next.outputs.release_tag }}
        run: |
          set -euo pipefail

          output="$(node scripts/release-tag.mjs --tag "${RELEASE_TAG}")"
          while IFS= read -r kv; do
            key="${kv%%=*}"
            value="${kv#*=}"
            echo "${key}=${value}" >> "$GITHUB_OUTPUT"
          done <<< "${output}"

      - name: Resolve release source and validate GA candidate
        id: source
        env:
          CANDIDATE_DIGEST: ${{ inputs.candidate_digest }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ steps.tag.outputs.is_prerelease }}
          RELEASE_TAG: ${{ steps.next.outputs.release_tag }}
          SOAK_OVERRIDE_REASON: ${{ inputs.soak_override_reason }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail

          source_sha="${TARGET_SHA}"
          image_digest=""
          soak_override_used="false"
          soak_override_age_seconds=""
          soak_override_age_days=""
          soak_override_reason_path=""

          if [ "${IS_PRERELEASE}" = "true" ]; then
            if [ -n "${CANDIDATE_TAG}" ] || [ -n "${CANDIDATE_DIGEST}" ]; then
              echo "::error::candidate_tag and candidate_digest are GA-only inputs. Leave both empty for ${RELEASE_TAG}."
              exit 1
            fi
            if [ -n "${SOAK_OVERRIDE_REASON}" ]; then
              echo "::error::soak_override_reason is a GA-only input. Leave it empty for ${RELEASE_TAG}."
              exit 1
            fi
          else
            if ! [[ "${CANDIDATE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
              echo "::error::GA releases require candidate_tag in exact vX.Y.Z-rc.N form."
              exit 1
            fi
            if ! [[ "${CANDIDATE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::GA releases require candidate_digest in exact sha256:<64 lowercase hex> form."
              exit 1
            fi
            if [ "${CANDIDATE_TAG%-rc.*}" != "${RELEASE_TAG}" ]; then
              echo "::error::Candidate ${CANDIDATE_TAG} does not belong to GA release ${RELEASE_TAG}."
              exit 1
            fi
            if ! git rev-parse -q --verify "refs/tags/${CANDIDATE_TAG}^{commit}" >/dev/null; then
              echo "::error::Candidate tag ${CANDIDATE_TAG} does not exist in the fetched repository."
              exit 1
            fi

            release_json="$(gh release view "${CANDIDATE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isPrerelease,publishedAt,tagName)"
            if [ "$(jq -r '.isPrerelease' <<< "${release_json}")" != "true" ]; then
              echo "::error::Candidate ${CANDIDATE_TAG} is not a published prerelease."
              exit 1
            fi
            published_at="$(jq -er '.publishedAt' <<< "${release_json}")"
            published_epoch="$(date -u -d "${published_at}" +%s)"
            age_seconds="$(( $(date -u +%s) - published_epoch ))"
            if [ "${age_seconds}" -lt 604800 ]; then
              # Trim leading/trailing whitespace so a lone space (or a string
              # that is only whitespace) cannot pass as a reason.
              trimmed_reason="$(printf '%s' "${SOAK_OVERRIDE_REASON}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
              if [ -z "${trimmed_reason}" ]; then
                echo "::error::Candidate ${CANDIDATE_TAG} is only ${age_seconds}s old; GA promotion requires seven full days (604800s)."
                exit 1
              fi
              if [ "${#trimmed_reason}" -lt 20 ]; then
                echo "::error::soak_override_reason must be at least 20 characters of real justification to bypass the seven-day soak; got ${#trimmed_reason} after trimming whitespace."
                exit 1
              fi

              age_days="$(awk -v s="${age_seconds}" 'BEGIN { printf "%.1f", s / 86400 }')"
              # The reason is free text and may be multiline, so it never goes
              # into a workflow command: a line starting with :: would be parsed
              # as a second command. The job summary and release notes carry it.
              echo "::warning::Candidate ${CANDIDATE_TAG} is only ${age_seconds}s (${age_days} days) old, short of the seven-day (604800s) soak requirement. Soak overridden; the justification is in the job summary and release notes."

              {
                echo "### :warning: Seven-day soak overridden for GA promotion"
                echo "- Candidate: \`${CANDIDATE_TAG}\`"
                echo "- Age at promotion: ${age_seconds}s (~${age_days} days) — short of the 604800s (7-day) requirement"
                echo "- Reason: ${trimmed_reason}"
              } >> "${GITHUB_STEP_SUMMARY}"

              # The reason is free text from a workflow_dispatch input (any repo
              # collaborator can supply it), so it is carried to later steps as
              # a file path rather than inlined into GITHUB_OUTPUT: appending
              # arbitrary multi-line content directly as `key=value` risks
              # output injection if it ever contains its own newlines or an
              # `EOF`-style delimiter.
              soak_override_used="true"
              soak_override_age_seconds="${age_seconds}"
              soak_override_age_days="${age_days}"
              soak_override_reason_path="${RUNNER_TEMP}/soak-override-reason.txt"
              printf '%s' "${trimmed_reason}" > "${soak_override_reason_path}"
            fi

            source_sha="$(git rev-parse "${CANDIDATE_TAG}^{commit}")"
            image_digest="${CANDIDATE_DIGEST}"
          fi

          if existing_sha="$(git rev-parse -q --verify "refs/tags/${RELEASE_TAG}^{commit}" 2>/dev/null)"; then
            if [ "${existing_sha}" != "${source_sha}" ]; then
              echo "::error::Existing ${RELEASE_TAG} tag points to ${existing_sha}, expected ${source_sha}."
              exit 1
            fi
            echo "Existing release tag matches the requested source; continuing recoverable finalization."
          fi

          {
            echo "source_sha=${source_sha}"
            echo "image_digest=${image_digest}"
            echo "soak_override_used=${soak_override_used}"
            echo "soak_override_age_seconds=${soak_override_age_seconds}"
            echo "soak_override_age_days=${soak_override_age_days}"
            echo "soak_override_reason_path=${soak_override_reason_path}"
          } >> "$GITHUB_OUTPUT"

      # `uses: ./.github/actions/...` resolves the composite action's YAML from
      # whatever is currently on disk in the runner workspace — not from the
      # commit the workflow itself was dispatched from. Both CI-wait steps
      # below MUST run before "Checkout exact release source": that step does
      # a literal `git checkout --detach`, so if the waits ran after it, a
      # maintenance cut would resolve this local action from the OLD copy
      # checked out from the (possibly long-retired) maintenance branch — one
      # that predates the allow-dispatch-events input entirely, so it would
      # silently ignore the flag, filter push-only, and time out every time,
      # since a named dev branch's push trigger only ever covers main. Keeping
      # the waits on the main checkout is also correct for normal cuts (source
      # and main are the same tree there), so this ordering is universally
      # safe, not just maintenance-safe.
      - name: Wait for successful branch CI on release source SHA
        uses: ./.github/actions/wait-for-successful-branch-ci
        with:
          github-token: ${{ github.token }}
          workflow-file: ${{ env.CI_VERIFY_WORKFLOW_FILE }}
          target-sha: ${{ steps.source.outputs.source_sha }}
          max-attempts: '18'
          sleep-seconds: '300'
          allow-dispatch-events: ${{ steps.source_ref.outputs.is_maintenance_cut }}

      - name: Wait for successful E2E Playwright on release source SHA
        uses: ./.github/actions/wait-for-successful-branch-ci
        with:
          github-token: ${{ github.token }}
          workflow-file: ${{ env.E2E_PLAYWRIGHT_WORKFLOW_FILE }}
          target-sha: ${{ steps.source.outputs.source_sha }}
          max-attempts: '18'
          sleep-seconds: '300'
          allow-dispatch-events: ${{ steps.source_ref.outputs.is_maintenance_cut }}

      - name: Checkout exact release source
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          git checkout --detach "${SOURCE_SHA}"
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

      - name: Assert tag version matches package versions
        env:
          BASE_VERSION: ${{ steps.tag.outputs.base_version }}
          RELEASE_TAG: ${{ steps.next.outputs.release_tag }}
        run: |
          set -euo pipefail

          version_files=(
            package.json
            package-lock.json
            app/package.json
            app/package-lock.json
            ui/package.json
            ui/package-lock.json
            e2e/package.json
            e2e/package-lock.json
          )

          for package_path in "${version_files[@]}"; do
            package_version="$(jq -r '.version // empty' "${package_path}")"
            if [ -z "${package_version}" ]; then
              echo "::error::Missing required version field in ${package_path}"
              exit 1
            fi
            if [ "${package_version}" != "${BASE_VERSION}" ]; then
              echo "::error::Version mismatch: tag base=${BASE_VERSION} (from ${RELEASE_TAG}), ${package_path}=${package_version}"
              exit 1
            fi
          done

          echo "Tag version ${BASE_VERSION} matches ${version_files[*]}."

      - name: Validate CHANGELOG entry for release tag
        env:
          CHANGELOG_PATH: ${{ steps.target_changelog.outputs.path }}
          EXTRACT_SCRIPT: ${{ steps.target_changelog.outputs.extract_script }}
          RELEASE_TAG: ${{ steps.next.outputs.release_tag }}
        run: |
          set -euo pipefail
          entry_file="$(mktemp)"

          # Read from the TARGET_SHA snapshots captured above (both the
          # CHANGELOG and the extractor script), not the checked-out SOURCE_SHA
          # tree — see the rationale in "Capture CHANGELOG snapshot from
          # target SHA".
          if ! node "${EXTRACT_SCRIPT}" --version "${RELEASE_TAG}" --file "${CHANGELOG_PATH}" > "${entry_file}" 2>/dev/null; then
            echo "::error::CHANGELOG entry for ${RELEASE_TAG} missing. Add heading '## [${RELEASE_TAG#v}] - YYYY-MM-DD' and retry."
            exit 1
          fi

          if ! awk 'NR > 1 && NF { found = 1; exit } END { exit found ? 0 : 1 }' "${entry_file}"; then
            echo "::error::CHANGELOG entry for ${RELEASE_TAG} is empty."
            exit 1
          fi

          # v1.7.0-rc.4 shipped with two `||||||| parent of ...` lines in its
          # entry: a hand-resolved conflict left the diff3 middle marker behind
          # and it read as ordinary prose to the gate, to CI, and to review.
          # scripts/conflict-markers.test.mjs catches it before a push, but the
          # cut is the last line of defence before it reaches a published tag
          # and the generated docs changelog. `if grep` is exempt from set -e,
          # so a clean file (exit 1, no match) does not abort the step.
          if grep -nE '^(<<<<<<<|\|\|\|\|\|\|\||>>>>>>>)([[:space:]]|$)' "${CHANGELOG_PATH}"; then
            echo "::error::CHANGELOG contains merge conflict markers (listed above). Resolve them before cutting ${RELEASE_TAG}."
            exit 1
          fi

          echo "Validated CHANGELOG entry for ${RELEASE_TAG}."

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Log in to GHCR
        id: login_ghcr
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        id: login_dockerhub
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to Quay.io
        id: login_quay
        continue-on-error: true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Retry GHCR login
        if: steps.login_ghcr.outcome == 'failure'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          timeout_minutes: 2
          max_attempts: 3
          retry_wait_seconds: 5
          command: |
            set -euo pipefail
            echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Retry Docker Hub login
        if: steps.login_dockerhub.outcome == 'failure'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          timeout_minutes: 2
          max_attempts: 3
          retry_wait_seconds: 5
          command: |
            set -euo pipefail
            echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin

      - name: Retry Quay.io login
        if: steps.login_quay.outcome == 'failure'
        env:
          QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
          QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          timeout_minutes: 2
          max_attempts: 3
          retry_wait_seconds: 5
          command: |
            set -euo pipefail
            echo "${QUAY_PASSWORD}" | docker login quay.io -u "${QUAY_USERNAME}" --password-stdin

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: |
            ghcr.io/${{ steps.target.outputs.repo_lower }}
            ${{ env.DOCKERHUB_REPO }}
            ${{ env.QUAY_REPO }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.next.outputs.release_tag }}
            type=match,pattern=^v(\d+\.\d+)\.\d+-rc\.\d+$,group=1,suffix=-rc,value=${{ steps.next.outputs.release_tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.next.outputs.release_tag }},enable=${{ steps.tag.outputs.is_prerelease == 'false' }}
            type=semver,pattern={{major}},value=${{ steps.next.outputs.release_tag }},enable=${{ steps.tag.outputs.is_prerelease == 'false' }}
            type=raw,value=latest,enable=${{ steps.tag.outputs.is_prerelease == 'false' }}

      - name: Docker staging metadata
        id: staging_meta
        if: steps.tag.outputs.is_prerelease == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: |
            ghcr.io/${{ steps.target.outputs.repo_lower }}
            ${{ env.DOCKERHUB_REPO }}
            ${{ env.QUAY_REPO }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=release-staging-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Validate GA candidate digest in every registry
        if: steps.tag.outputs.is_prerelease == 'false'
        env:
          CANDIDATE_DIGEST: ${{ steps.source.outputs.image_digest }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          GHCR_REPO: ${{ steps.target.outputs.repo_lower }}
        run: |
          set -euo pipefail
          candidate_refs=(
            "ghcr.io/${GHCR_REPO}:${CANDIDATE_TAG#v}"
            "${DOCKERHUB_REPO}:${CANDIDATE_TAG#v}"
            "${QUAY_REPO}:${CANDIDATE_TAG#v}"
          )

          for candidate_ref in "${candidate_refs[@]}"; do
            raw_manifest="$(mktemp)"
            docker buildx imagetools inspect --raw "${candidate_ref}" > "${raw_manifest}"
            computed_digest="sha256:$(sha256sum "${raw_manifest}" | cut -d ' ' -f 1)"
            rm -f "${raw_manifest}"
            if [ "${computed_digest}" != "${CANDIDATE_DIGEST}" ]; then
              echo "::error::${candidate_ref} resolves to ${computed_digest}, expected exact candidate ${CANDIDATE_DIGEST}."
              exit 1
            fi
          done

      - name: Build and push staging image
        id: build
        if: steps.tag.outputs.is_prerelease == 'true'
        continue-on-error: true  # allow manifest retry path on transient push failures
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          push: true
          platforms: ${{ env.DOCKER_PLATFORMS }}
          tags: ${{ steps.staging_meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: DD_VERSION=${{ steps.next.outputs.next_version }}
          sbom: true
          provenance: mode=min
          cache-from: type=gha,scope=drydock
          cache-to: type=gha,mode=max,scope=drydock,ignore-error=true

      - name: Retry manifest publish on transient registry failure
        id: manifest-retry
        if: steps.tag.outputs.is_prerelease == 'true' && steps.build.outcome == 'failure'
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.staging_meta.outputs.tags }}
          GHCR_REPO: ${{ steps.target.outputs.repo_lower }}
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 5
          command: |
            set -euo pipefail

            if [ -z "${BUILD_DIGEST:-}" ]; then
              echo "::error::Build step failed before producing a digest; cannot retry manifest publish without a source digest."
              exit 1
            fi

            source_candidates=(
              "ghcr.io/${GHCR_REPO}@${BUILD_DIGEST}"
              "${DOCKERHUB_REPO}@${BUILD_DIGEST}"
              "${QUAY_REPO}@${BUILD_DIGEST}"
            )

            source_ref=""
            for candidate in "${source_candidates[@]}"; do
              if docker buildx imagetools inspect "${candidate}" >/dev/null 2>&1; then
                source_ref="${candidate}"
                break
              fi
            done

            if [ -z "${source_ref}" ]; then
              echo "::error::No registry contains source manifest digest ${BUILD_DIGEST}; cannot perform manifest-only retry."
              exit 1
            fi

            while IFS= read -r tag; do
              [ -z "${tag}" ] && continue
              echo "Re-pushing manifest tag: ${tag} (source: ${source_ref})"
              docker buildx imagetools create --tag "${tag}" "${source_ref}" >/dev/null
            done <<< "${TAGS}"

            echo "digest=${BUILD_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Resolve image digest
        id: digest
        env:
          CANDIDATE_DIGEST: ${{ steps.source.outputs.image_digest }}
          RETRY_DIGEST: ${{ steps.manifest-retry.outputs.digest }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          digest="${CANDIDATE_DIGEST:-${RETRY_DIGEST:-${BUILD_DIGEST:-}}}"
          if ! [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Release source did not produce a valid image digest."
            exit 1
          fi
          echo "value=${digest}" >> "$GITHUB_OUTPUT"

      - name: Resolve image source references
        id: image_refs
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          GHCR_REPO: ${{ steps.target.outputs.repo_lower }}
          IS_PRERELEASE: ${{ steps.tag.outputs.is_prerelease }}
          STAGING_TAGS: ${{ steps.staging_meta.outputs.tags }}
        run: |
          set -euo pipefail
          {
            echo 'tags<<DRYDOCK_IMAGE_REFS'
            if [ "${IS_PRERELEASE}" = "true" ]; then
              printf '%s\n' "${STAGING_TAGS}"
            else
              echo "ghcr.io/${GHCR_REPO}:${CANDIDATE_TAG#v}"
              echo "${DOCKERHUB_REPO}:${CANDIDATE_TAG#v}"
              echo "${QUAY_REPO}:${CANDIDATE_TAG#v}"
            fi
            echo 'DRYDOCK_IMAGE_REFS'
          } >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign container images
        if: steps.tag.outputs.is_prerelease == 'true'
        env:
          DIGEST: ${{ steps.digest.outputs.value }}
          TAGS: ${{ steps.image_refs.outputs.tags }}
        run: |
          set -euo pipefail
          images=()
          while IFS= read -r tag; do
            [ -n "${tag}" ] && images+=("${tag}@${DIGEST}")
          done <<< "${TAGS}"
          cosign sign --yes "${images[@]}"

      - name: Verify container image signatures
        env:
          DIGEST: ${{ steps.digest.outputs.value }}
          TAGS: ${{ steps.image_refs.outputs.tags }}
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 5
          command: |
            set -euo pipefail
            # OIDC identity pinned to release-cut.yml@refs/heads/main; the
            # branch guard at the top of this job enforces the ref. See
            # content/docs/current/guides/verifying-releases for the user-facing
            # identity regex.
            identity_regex="^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-cut.yml@refs/heads/main$"
            issuer="https://token.actions.githubusercontent.com"

            images=()
            while IFS= read -r tag; do
              [ -n "${tag}" ] && images+=("${tag}@${DIGEST}")
            done <<< "${TAGS}"

            if [ "${#images[@]}" -eq 0 ]; then
              echo "::error::No images found to verify"
              exit 1
            fi

            for image in "${images[@]}"; do
              echo "Verifying cosign signature for ${image}"
              cosign verify \
                --certificate-identity-regexp "${identity_regex}" \
                --certificate-oidc-issuer "${issuer}" \
                "${image}" >/dev/null
            done

      # ────────────────────────────────────────────────────────────────────
      # Defect 3 — SLSA build provenance is structurally impossible to make
      # honest for a maintenance cut, so it is not attempted at all.
      #
      # `actions/attest-build-provenance` (and `actions/attest`) derive the
      # attested build source from the run's OIDC token `sha` claim, which
      # GitHub fixes to the dispatch-time SHA of the ref the workflow ran at —
      # here always refs/heads/main, per the branch guard at the top of this
      # job. That claim is baked into the token at run start; nothing this job
      # does afterward, including "Checkout exact release source" detaching to
      # a different commit, can change it. For a maintenance cut, the tree
      # actually built is a named dev branch's tip, a DIFFERENT commit than
      # main HEAD — so any attestation produced in this run would assert
      # "built from main HEAD" about an artifact that was not.
      #
      # That is precisely the "silently wrong provenance, worse than a hard
      # failure" this workflow already refuses to produce at GA (see Defect 2
      # above) — and it would be worse here, because the false attestation
      # gets pushed to the registry (and Sigstore's public transparency log)
      # BEFORE this job's own downstream verify step (which correctly checks
      # against the true SOURCE_SHA) catches the mismatch and fails the run.
      # A failed run must never leave behind a published false claim that
      # can't be un-published.
      #
      # So: for a maintenance cut (steps.source_ref.outputs.is_maintenance_cut
      # == 'true'), every attest/verify step in this provenance chain —
      # container image, container SBOM, and (further below) the release
      # tarball, plus their GA-side re-verification/promotion — is skipped
      # entirely, both at RC-cut time and when promoting that RC to GA later.
      # Cosign SIGNING is NOT skipped: cosign only proves "this identity
      # (release-cut.yml@refs/heads/main) signed this artifact," which stays
      # true regardless of source_ref, unlike a provenance predicate that
      # names a specific source commit. The true build source SHA is instead
      # recorded in the job summary and the published release notes as plain,
      # human-readable fact — see "Release summary" and "Generate release
      # notes from changelog" below.
      # ────────────────────────────────────────────────────────────────────

      - name: Attest container build provenance
        id: attest_container_image
        if: steps.tag.outputs.is_prerelease == 'true' && steps.source_ref.outputs.is_maintenance_cut != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.target.outputs.repo_lower }}
          subject-digest: ${{ steps.digest.outputs.value }}
          push-to-registry: true

      - name: Verify container build provenance attestation
        if: steps.source_ref.outputs.is_maintenance_cut != 'true'
        env:
          DIGEST: ${{ steps.digest.outputs.value }}
          GHCR_REPO: ${{ steps.target.outputs.repo_lower }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://ghcr.io/${GHCR_REPO}@${DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-cut.yml" \
            --source-ref refs/heads/main \
            --source-digest "${SOURCE_SHA}" \
            --bundle-from-oci >/dev/null

      - name: Generate container SBOM
        env:
          DIGEST: ${{ steps.digest.outputs.value }}
          GHCR_REPO: ${{ steps.target.outputs.repo_lower }}
          RELEASE_TAG: ${{ steps.next.outputs.release_tag }}
          TRIVY_IMAGE: aquasec/trivy@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f  # 0.72.0
        run: |
          set -euo pipefail
          mkdir -p dist
          image_ref="ghcr.io/${GHCR_REPO}@${DIGEST}"
          sbom_path="dist/drydock-${RELEASE_TAG}.image.spdx.json"

          docker run --rm \
            --volume "${PWD}/dist:/out" \
            --volume "${HOME}/.docker:/root/.docker:ro" \
            "${TRIVY_IMAGE}" \
            image \
            --format spdx-json \
            --output "/out/$(basename "${sbom_path}")" \
            --timeout 15m \
            "${image_ref}"

          jq -e '.spdxVersion == "SPDX-2.3" and (.packages | type == "array")' "${sbom_path}" >/dev/null

      - name: Attest container SBOM
        id: attest_container_sbom
        if: steps.tag.outputs.is_prerelease == 'true' && steps.source_ref.outputs.is_maintenance_cut != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.target.outputs.repo_lower }}
          subject-digest: ${{ steps.digest.outputs.value }}
          subject-version: ${{ steps.next.outputs.next_version }}
          sbom-path: dist/drydock-${{ steps.next.outputs.release_tag }}.image.spdx.json
          push-to-registry: true

      - name: Verify container SBOM attestation
        if: steps.source_ref.outputs.is_maintenance_cut != 'true'
        env:
          DIGEST: ${{ steps.digest.outputs.value }}
          GHCR_REPO: ${{ steps.target.outputs.repo_lower }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://ghcr.io/${GHCR_REPO}@${DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-cut.yml" \
            --source-ref refs/heads/main \
            --source-digest "${SOURCE_SHA}" \
            --predicate-type https://spdx.dev/Document/v2.3 \
            --bundle-from-oci >/dev/null

      - name: Build release artifact
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          IS_PRERELEASE: ${{ steps.tag.outputs.is_prerelease }}
          RELEASE_TAG: ${{ steps.next.outputs.release_tag }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          # At GA, SOURCE_SHA is the RC candidate's commit, not this run's own
          # tag. Archive it under the prefix the RC build itself used
          # (CANDIDATE_TAG), not RELEASE_TAG's GA-versioned prefix. git archive
          # embeds no build-time timestamps (each entry's mtime is that blob's
          # committer date) and the tree + prefix are its only other inputs, so
          # identical tree + identical prefix + same git version reproduces the
          # RC artifact byte-for-byte. That equality is what "Verify candidate
          # artifact is reproducible from source SHA" below relies on — using
          # RELEASE_TAG's own prefix here would make this rebuild diverge from
          # the RC artifact by construction and always fail that check. This
          # rebuild is never published directly at GA; see the promotion steps
          # below for why (Defect 2: attestation provenance).
          if [ "${IS_PRERELEASE}" = "true" ]; then
            archive_tag="${RELEASE_TAG}"
          else
            archive_tag="${CANDIDATE_TAG}"
          fi
          artifact="dist/drydock-${archive_tag}.tar.gz"
          git archive --format=tar.gz --prefix="drydock-${archive_tag}/" --output="${artifact}" "${SOURCE_SHA}"
          sha256sum "${artifact}" > "${artifact}.sha256"

      # ────────────────────────────────────────────────────────────────────
      # Defect 2 — artifact provenance at GA: design decision
      #
      # actions/attest-build-provenance always records the WORKFLOW RUN's own
      # checkout commit (github.sha) as the attested subject's build source.
      # At GA that is TARGET_SHA (today's main HEAD), never SOURCE_SHA (the
      # seven-day-soaked candidate commit the tarball is actually built from).
      # Rebuilding and re-attesting inside the GA run — option (b): keep
      # rebuilding, keep attesting, verify with TARGET_SHA since that is what
      # the attestation truthfully records — would produce an attestation
      # that verifies cleanly while asserting a false claim: "this tarball
      # was built from TARGET_SHA" when its tree is actually SOURCE_SHA's.
      # That is silently wrong provenance, worse than a hard failure, and it
      # also breaks the promotion model everywhere else in this workflow:
      # the container image is never rebuilt at GA either — it reuses the
      # exact RC digest and re-verifies the RC-time attestation against
      # SOURCE_SHA (see "Verify container build provenance attestation" and
      # "Verify container SBOM attestation" above, both intentionally
      # SOURCE_SHA-keyed and correct as-is).
      #
      # Chosen instead — option (a), mirroring that container-image pattern:
      # at GA, do not rebuild or re-attest the release artifact at all.
      # Download the candidate's already-published tar.gz and its
      # .intoto.jsonl bundle from the RC's GitHub release, re-verify that
      # existing attestation against SOURCE_SHA (honest at RC time, since
      # SOURCE_SHA == TARGET_SHA when the RC was cut), prove by a fresh
      # git-archive rebuild that the downloaded bytes still match SOURCE_SHA's
      # tree today, and republish those same soaked bytes under the GA tag.
      # The GA artifact IS the promoted RC artifact with its original honest
      # provenance — true promotion semantics, not a rebuild with mislabeled
      # provenance. The signing/attestation steps below therefore only run
      # for prereleases, where SOURCE_SHA == TARGET_SHA and rebuild-then-attest
      # is correct exactly as it was before this fix.
      # ────────────────────────────────────────────────────────────────────

      - name: Download candidate release artifact for promotion
        if: steps.tag.outputs.is_prerelease == 'false'
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          GH_TOKEN: ${{ github.token }}
          IS_MAINTENANCE_CUT: ${{ steps.source_ref.outputs.is_maintenance_cut }}
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            set -euo pipefail
            mkdir -p dist/candidate
            # See "Defect 3" above the container-image attestation steps: a
            # maintenance-cut RC never attested (that would have published a
            # false provenance claim), so its release carries no
            # .intoto.jsonl asset to download here.
            patterns=(
              "drydock-${CANDIDATE_TAG}.tar.gz"
              "drydock-${CANDIDATE_TAG}.tar.gz.sha256"
              "drydock-${CANDIDATE_TAG}.tar.gz.bundle"
              "drydock-${CANDIDATE_TAG}.tar.gz.sig"
              "drydock-${CANDIDATE_TAG}.tar.gz.pem"
            )
            if [ "${IS_MAINTENANCE_CUT}" != "true" ]; then
              patterns+=("drydock-${CANDIDATE_TAG}.tar.gz.intoto.jsonl")
            fi
            pattern_args=()
            for pattern in "${patterns[@]}"; do
              pattern_args+=(--pattern "${pattern}")
            done
            gh release download "${CANDIDATE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --dir dist/candidate \
              --clobber \
              "${pattern_args[@]}"

      - name: Verify downloaded candidate artifact checksum
        if: steps.tag.outputs.is_prerelease == 'false'
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          set -euo pipefail
          # Not `sha256sum -c`: the .sha256 file was written as
          # `sha256sum dist/drydock-<tag>.tar.gz > ...` at repo-root cwd during
          # the RC build, so it embeds the path "dist/drydock-<tag>.tar.gz".
          # The download step above lands the file flat in dist/candidate/, so
          # -c's embedded-path lookup would miss it regardless of directory —
          # compare the recorded hash value directly instead.
          artifact="dist/candidate/drydock-${CANDIDATE_TAG}.tar.gz"
          recorded_hash="$(awk '{print $1}' "${artifact}.sha256")"
          actual_hash="$(sha256sum "${artifact}" | awk '{print $1}')"
          if [ "${recorded_hash}" != "${actual_hash}" ]; then
            echo "::error::Downloaded ${artifact} (sha256=${actual_hash}) does not match its published checksum (${recorded_hash})."
            exit 1
          fi

      - name: Verify candidate artifact provenance attestation
        if: steps.tag.outputs.is_prerelease == 'false' && steps.source_ref.outputs.is_maintenance_cut != 'true'
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          # This re-verifies the attestation actions/attest-build-provenance
          # produced during the RC run, which honestly recorded SOURCE_SHA as
          # its build source (SOURCE_SHA == TARGET_SHA at RC-cut time).
          artifact="dist/candidate/drydock-${CANDIDATE_TAG}.tar.gz"
          gh attestation verify "${artifact}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-cut.yml" \
            --source-ref refs/heads/main \
            --source-digest "${SOURCE_SHA}" \
            --bundle "${artifact}.intoto.jsonl" >/dev/null

      - name: Verify candidate artifact signature
        if: steps.tag.outputs.is_prerelease == 'false'
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          set -euo pipefail
          artifact="dist/candidate/drydock-${CANDIDATE_TAG}.tar.gz"
          identity_regex="^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-cut.yml@refs/heads/main$"
          issuer="https://token.actions.githubusercontent.com"

          cosign verify-blob \
            --bundle "${artifact}.bundle" \
            --certificate-identity-regexp "${identity_regex}" \
            --certificate-oidc-issuer "${issuer}" \
            "${artifact}" >/dev/null

      - name: Verify candidate artifact is reproducible from source SHA
        if: steps.tag.outputs.is_prerelease == 'false'
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          set -euo pipefail
          # "Build release artifact" above already rebuilt SOURCE_SHA's tree
          # under CANDIDATE_TAG's own prefix for exactly this comparison. This
          # proves the downloaded RC bytes still carry what SOURCE_SHA's tree
          # contains today before they get promoted to the GA release below.
          #
          # Compare DECOMPRESSED tar streams, not gzip bytes: gzip encoding can
          # drift between the git versions on the RC-cut and GA runners, which
          # would fail a byte-compare on identical trees and hard-block a
          # legitimate GA. Tamper detection is not this step's job — the
          # signature and attestation verifies above already pin the downloaded
          # artifact's exact original bytes. This step only asserts tree
          # identity, which the tar stream captures fully (entry mtimes are
          # commit dates, no build-time inputs).
          rebuilt="dist/drydock-${CANDIDATE_TAG}.tar.gz"
          downloaded="dist/candidate/drydock-${CANDIDATE_TAG}.tar.gz"
          rebuilt_sha="$(gzip -dc "${rebuilt}" | sha256sum | cut -d ' ' -f 1)"
          downloaded_sha="$(gzip -dc "${downloaded}" | sha256sum | cut -d ' ' -f 1)"
          if [ "${rebuilt_sha}" != "${downloaded_sha}" ]; then
            echo "::error::Candidate artifact ${downloaded} (content sha256=${downloaded_sha}) does not match a fresh git archive of ${CANDIDATE_TAG}'s source SHA (content sha256=${rebuilt_sha}). Refusing to promote a non-reproducible artifact."
            exit 1
          fi
          echo "Candidate artifact is reproducible from source SHA."

      - name: Promote candidate artifact to GA release filenames
        if: steps.tag.outputs.is_prerelease == 'false'
        env:
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          RELEASE_TAG: ${{ steps.next.outputs.release_tag }}
          IS_MAINTENANCE_CUT: ${{ steps.source_ref.outputs.is_maintenance_cut }}
        run: |
          set -euo pipefail
          # The promoted asset keeps the RC build's internal tar prefix
          # (drydock-${CANDIDATE_TAG}/) — renaming the release-asset *filename*
          # to the GA tag is cosmetic, not a content change, so the RC's
          # existing cosign signature and provenance attestation (both computed
          # over file bytes, never over the filename) stay valid without being
          # redone.
          #
          # tar.gz.intoto.jsonl is promoted too, except for a maintenance cut:
          # see "Defect 3" above — the RC never produced one, so there is
          # nothing at dist/candidate/ to copy.
          exts=(tar.gz tar.gz.sha256 tar.gz.bundle tar.gz.sig tar.gz.pem)
          if [ "${IS_MAINTENANCE_CUT}" != "true" ]; then
            exts+=(tar.gz.intoto.jsonl)
          fi
          for ext in "${exts[@]}"; do
            cp "dist/candidate/drydock-${CANDIDATE_TAG}.${ext}" "dist/drydock-${RELEASE_TAG}.${ext}"
          done
          # Regenerate the checksum file so its embedded filename matches the
          # promoted name; the hash itself is unchanged since the bytes are.
          (cd dist && sha256sum "drydock-${RELEASE_TAG}.tar.gz" > "drydock-${RELEASE_TAG}.tar.gz.sha256")

      - name: Sign release artifact
        if: steps.tag.outputs.is_prerelease == 'true'
        env:
          RELEASE_TAG: ${{ steps.next.outputs.release_tag }}
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 5
          command: |
            set -euo pipefail
            artifact="dist/drydock-${RELEASE_TAG}.tar.gz"
            rm -f "${artifact}.bundle" "${artifact}.sig" "${artifact}.pem"
            cosign sign-blob --yes \
              --bundle "${artifact}.bundle" \
              "${artifact}"

            sig_b64="$(jq -er '.base64Signature // .messageSignature.signature' "${artifact}.bundle")"
            printf '%s' "${sig_b64}" | base64 --decode > "${artifact}.sig"

            cert_pem="$(jq -r '.cert // empty' "${artifact}.bundle")"
            if [ -n "${cert_pem}" ]; then
              printf '%s\n' "${cert_pem}" > "${artifact}.pem"
            else
              cert_der_b64="$(jq -er '.verificationMaterial.certificate.rawBytes' "${artifact}.bundle")"
              printf '%s' "${cert_der_b64}" | base64 --decode | openssl x509 -inform DER -out "${artifact}.pem"
            fi

            if [ ! -s "${artifact}.sig" ] || [ ! -s "${artifact}.pem" ]; then
              echo "::error::Expected signature outputs were not generated"
              ls -la dist
              jq 'keys' "${artifact}.bundle" || true
              exit 1
            fi

      - name: Verify release artifact signature
        if: steps.tag.outputs.is_prerelease == 'true'
        env:
          RELEASE_TAG: ${{ steps.next.outputs.release_tag }}
        run: |
          set -euo pipefail
          artifact="dist/drydock-${RELEASE_TAG}.tar.gz"
          identity_regex="^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-cut.yml@refs/heads/main$"
          issuer="https://token.actions.githubusercontent.com"

          cosign verify-blob \
            --bundle "${artifact}.bundle" \
            --certificate-identity-regexp "${identity_regex}" \
            --certificate-oidc-issuer "${issuer}" \
            "${artifact}" >/dev/null

      - name: Attest release artifact provenance
        id: attest_release_artifact
        if: steps.tag.outputs.is_prerelease == 'true' && steps.source_ref.outputs.is_maintenance_cut != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/drydock-${{ steps.next.outputs.release_tag }}.tar.gz

      - name: Export release provenance asset
        if: steps.tag.outputs.is_prerelease == 'true' && steps.source_ref.outputs.is_maintenance_cut != 'true'
        env:
          RELEASE_TAG: ${{ steps.next.outputs.release_tag }}
          BUNDLE_PATH: ${{ steps.attest_release_artifact.outputs.bundle-path }}
        run: |
          set -euo pipefail
          artifact="dist/drydock-${RELEASE_TAG}.tar.gz"
          cp "${BUNDLE_PATH}" "${artifact}.intoto.jsonl"

      - name: Verify release artifact provenance attestation
        if: steps.tag.outputs.is_prerelease == 'true' && steps.source_ref.outputs.is_maintenance_cut != 'true'
        env:
          RELEASE_TAG: ${{ steps.next.outputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          # Prerelease only: SOURCE_SHA == TARGET_SHA here, so asserting
          # TARGET_SHA is equivalent to asserting SOURCE_SHA and matches what
          # "Attest release artifact provenance" actually just recorded.
          artifact="dist/drydock-${RELEASE_TAG}.tar.gz"
          gh attestation verify "${artifact}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-cut.yml" \
            --source-ref refs/heads/main \
            --source-digest "${TARGET_SHA}" \
            --bundle "${artifact}.intoto.jsonl" >/dev/null

      - name: Generate release notes from changelog
        id: release_notes
        env:
          CHANGELOG_PATH: ${{ steps.target_changelog.outputs.path }}
          EXTRACT_SCRIPT: ${{ steps.target_changelog.outputs.extract_script }}
          RELEASE_TAG: ${{ steps.next.outputs.release_tag }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          SOAK_OVERRIDE_USED: ${{ steps.source.outputs.soak_override_used }}
          SOAK_OVERRIDE_AGE_SECONDS: ${{ steps.source.outputs.soak_override_age_seconds }}
          SOAK_OVERRIDE_AGE_DAYS: ${{ steps.source.outputs.soak_override_age_days }}
          SOAK_OVERRIDE_REASON_PATH: ${{ steps.source.outputs.soak_override_reason_path }}
          IS_MAINTENANCE_CUT: ${{ steps.source_ref.outputs.is_maintenance_cut }}
          SOURCE_BRANCH: ${{ steps.source_ref.outputs.source_branch }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          notes_path="dist/release-notes-${RELEASE_TAG}.md"

          entry_path="$(mktemp)"
          missing_heading="## [${RELEASE_TAG#v}] - YYYY-MM-DD"
          # Same TARGET_SHA snapshots as the validation step above — the GA
          # heading (and the parser that reads it) live on main, never in the
          # detached SOURCE_SHA checkout.
          if ! node "${EXTRACT_SCRIPT}" --version "${RELEASE_TAG}" --file "${CHANGELOG_PATH}" > "${entry_path}"; then
            rm -f "${entry_path}" "${notes_path}"
            echo "::error::Release notes generation failed: CHANGELOG entry missing for ${RELEASE_TAG}. Add heading '${missing_heading}' and retry release."
            {
              echo "### Release Notes Generation"
              echo "- Result: FAIL"
              echo "- AI_ACTION_REQUIRED: Add CHANGELOG entry for \`${RELEASE_TAG}\` using heading \`${missing_heading}\`, then re-run release."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

          # Resolve the previous release for a Full Changelog compare link. The
          # current tag is not pushed yet, so the newest existing release is the
          # predecessor; the select() guards re-runs after a partial release.
          prev_tag="$(gh release list --repo "${REPO}" --limit 100 \
            --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | map(.tagName)
                  | map(select(. != env.RELEASE_TAG)) | .[0] // empty' \
            2>/dev/null || true)"

          {
            echo "# ${RELEASE_TAG}"
            echo ""
            if [ -n "${prev_tag}" ]; then
              echo "**Full Changelog**: https://github.com/${REPO}/compare/${prev_tag}...${RELEASE_TAG}"
              echo ""
            fi
            cat "${entry_path}"
          } > "${notes_path}"
          rm -f "${entry_path}"

          # Standing upgrade notes: the per-version extract above only carries
          # notes written into that one CHANGELOG section, so a release that did
          # not repeat the 1.4.6/1.5 behavioral-change callout would ship without
          # it. Append the maintained block to every 1.4.6+ / 1.5.x release
          # (idempotent — skipped if the section already inlines the marker).
          node scripts/append-upgrade-notes.mjs \
            --notes "${notes_path}" \
            --version "${RELEASE_TAG}" \
            --file UPGRADE-NOTES.md

          # GA-only: the seven-day soak was shortened via soak_override_reason
          # on the "Resolve release source" step. Record it in the published
          # release body too, not just the run summary, so anyone reading the
          # release later can see the soak was cut short and why.
          if [ "${SOAK_OVERRIDE_USED:-false}" = "true" ]; then
            override_reason="$(cat "${SOAK_OVERRIDE_REASON_PATH}")"
            {
              echo ""
              echo "---"
              echo ""
              echo "**Note:** the standard seven-day release-candidate soak was shortened for this release."
              echo "- Candidate age at promotion: ${SOAK_OVERRIDE_AGE_SECONDS}s (~${SOAK_OVERRIDE_AGE_DAYS} days), short of the usual 7 days (604800s)."
              echo "- Reason: ${override_reason}"
            } >> "${notes_path}"
          fi

          # Maintenance cut: record the TRUE build source plainly, since no
          # machine-verifiable SLSA provenance attestation exists for it (see
          # "Defect 3" above the container-image attestation steps) — the
          # OIDC claim this run's own attestation would have carried is always
          # main HEAD, not this branch's tip, so attesting would have
          # published a false claim instead. This note is the honest
          # replacement: a human-readable fact, not a cryptographic one.
          if [ "${IS_MAINTENANCE_CUT}" = "true" ]; then
            {
              echo ""
              echo "---"
              echo ""
              echo "**Note:** this is a maintenance cut, built from \`${SOURCE_BRANCH}\` at \`${SOURCE_SHA}\`, not from \`main\`."
              echo "- The container image and release artifact are cosign-signed (identity \`release-cut.yml@refs/heads/main\`, since the workflow run itself always executes at that ref), but carry **no SLSA build-provenance attestation** — this workflow's own OIDC token always claims \`main\` HEAD as the build source, which would be false for this artifact, so attestation is skipped rather than publish a false claim."
            } >> "${notes_path}"
          fi

          echo "path=${notes_path}" >> "$GITHUB_OUTPUT"

      - name: Prepare draft GitHub Release and upload signed assets
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ steps.tag.outputs.is_prerelease }}
          IS_MAINTENANCE_CUT: ${{ steps.source_ref.outputs.is_maintenance_cut }}
          RELEASE_TAG: ${{ steps.next.outputs.release_tag }}
          RELEASE_NOTES_PATH: ${{ steps.release_notes.outputs.path }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 5
          command: |
            set -euo pipefail
            prerelease_args=()
            if [ "${IS_PRERELEASE}" = "true" ]; then
              prerelease_args=(--prerelease)
            fi

            if gh release view "${RELEASE_TAG}" --json isDraft >/tmp/drydock-release.json 2>/dev/null; then
              if [ "$(jq -r '.isDraft' /tmp/drydock-release.json)" != "true" ]; then
                echo "::error::Release ${RELEASE_TAG} is already public; refusing to alter it."
                exit 1
              fi
            else
              gh release create "${RELEASE_TAG}" \
                --draft \
                --target "${SOURCE_SHA}" \
                --title "${RELEASE_TAG}" \
                --notes-file "${RELEASE_NOTES_PATH}" \
                "${prerelease_args[@]}"
            fi

            gh release edit "${RELEASE_TAG}" \
              --draft \
              --title "${RELEASE_TAG}" \
              --notes-file "${RELEASE_NOTES_PATH}" \
              "${prerelease_args[@]}"

            # See "Defect 3" above the container-image attestation steps: a
            # maintenance cut never produces dist/drydock-${RELEASE_TAG}.tar.gz.intoto.jsonl
            # (attesting it would publish a false build-source claim), so it is
            # never in the upload list for one.
            assets=(
              "dist/drydock-${RELEASE_TAG}.tar.gz"
              "dist/drydock-${RELEASE_TAG}.tar.gz.sha256"
              "dist/drydock-${RELEASE_TAG}.tar.gz.bundle"
              "dist/drydock-${RELEASE_TAG}.tar.gz.sig"
            )
            if [ "${IS_MAINTENANCE_CUT}" != "true" ]; then
              assets+=("dist/drydock-${RELEASE_TAG}.tar.gz.intoto.jsonl")
            fi
            assets+=(
              "dist/drydock-${RELEASE_TAG}.tar.gz.pem"
              "dist/drydock-${RELEASE_TAG}.image.spdx.json"
            )
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber

      # ────────────────────────────────────────────────────────────────────
      # PUBLIC FINALIZATION
      # All expensive and failure-prone preparation is complete. The remaining
      # operations are ordered and idempotent: publish exact-digest image tags,
      # push/verify the git tag, then publish the prepared draft release. If a
      # service fails between steps, re-dispatching resumes from verified state.
      # ────────────────────────────────────────────────────────────────────

      - name: Publish release image tags
        env:
          DIGEST: ${{ steps.digest.outputs.value }}
          SOURCE_REFS: ${{ steps.image_refs.outputs.tags }}
          TAGS: ${{ steps.meta.outputs.tags }}
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 5
          command: |
            set -euo pipefail
            while IFS= read -r tag; do
              [ -z "${tag}" ] && continue
              target_repository="${tag%:*}"
              source_ref=""
              while IFS= read -r candidate; do
                [ -z "${candidate}" ] && continue
                if [ "${candidate%:*}" = "${target_repository}" ] && \
                  docker buildx imagetools inspect "${candidate}@${DIGEST}" >/dev/null 2>&1; then
                  source_ref="${candidate%@*}@${DIGEST}"
                  break
                fi
              done <<< "${SOURCE_REFS}"
              if [ -z "${source_ref}" ]; then
                echo "::error::${target_repository} does not expose exact source digest ${DIGEST}."
                exit 1
              fi

              docker buildx imagetools create --tag "${tag}" "${source_ref}" >/dev/null
              raw_manifest="$(mktemp)"
              docker buildx imagetools inspect --raw "${tag}" > "${raw_manifest}"
              published_digest="sha256:$(sha256sum "${raw_manifest}" | cut -d ' ' -f 1)"
              rm -f "${raw_manifest}"
              if [ "${published_digest}" != "${DIGEST}" ]; then
                echo "::error::Published ${tag} resolved to ${published_digest}, expected ${DIGEST}."
                exit 1
              fi
            done <<< "${TAGS}"

      - name: Push release tag
        env:
          RELEASE_TAG: ${{ steps.next.outputs.release_tag }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if remote_sha="$(git ls-remote --exit-code origin "refs/tags/${RELEASE_TAG}^{}" | awk '{print $1}')"; then
            if [ "${remote_sha}" != "${SOURCE_SHA}" ]; then
              echo "::error::Remote tag ${RELEASE_TAG} points to ${remote_sha}, expected ${SOURCE_SHA}."
              exit 1
            fi
            echo "Remote tag already points to the exact release source."
          else
            git tag -a -f "${RELEASE_TAG}" "${SOURCE_SHA}" -m "release: ${RELEASE_TAG}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.next.outputs.release_tag }}
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 5
          command: |
            set -euo pipefail
            gh release edit "${RELEASE_TAG}" --draft=false
            if [ "$(gh release view "${RELEASE_TAG}" --json isDraft --jq '.isDraft')" != "false" ]; then
              echo "::error::Release ${RELEASE_TAG} is still a draft after publish."
              exit 1
            fi

      - name: Dispatch starchart refresh
        if: steps.source_ref.outputs.is_maintenance_cut != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.next.outputs.release_tag }}
        run: |
          set -euo pipefail
          # starchart.yml's release: published trigger can never fire: this job creates
          # the release with GH_TOKEN (github.token), and GitHub suppresses workflow runs
          # for events caused by GITHUB_TOKEN — the same suppression that keeps the
          # pushed release tag above from re-triggering anything itself. workflow_dispatch
          # is one of the two documented exceptions (repository_dispatch is the other),
          # so the cut dispatches the chart refresh explicitly instead of relying on the
          # release event.
          #
          # Mainline cuts only (see the `if:` above): a maintenance dev/vX.Y branch
          # doesn't carry starchart.yml, so dispatching there would fail on a missing
          # workflow and redden an otherwise-good maintenance GA; and a maintenance line
          # never owns the published README anyway — GitHub renders main's README, and
          # maintenance cuts never promote to main, so a chart refresh there would update
          # a page nobody sees.
          minor="$(printf '%s' "${RELEASE_TAG}" | sed -E 's/^v?([0-9]+)\.([0-9]+)\..*/\1.\2/')"
          dev_branch="dev/v${minor}"
          gh workflow run starchart.yml --ref "${dev_branch}"

      - name: Release summary
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          RELEASE_LEVEL: ${{ steps.next.outputs.release_level }}
          NEXT_VERSION: ${{ steps.next.outputs.next_version }}
          RELEASE_TAG: ${{ steps.next.outputs.release_tag }}
          DIGEST: ${{ steps.digest.outputs.value }}
          IS_MAINTENANCE_CUT: ${{ steps.source_ref.outputs.is_maintenance_cut }}
          SOURCE_BRANCH: ${{ steps.source_ref.outputs.source_branch }}
        run: |
          {
            echo "### Release Summary"
            echo "- Release source SHA: \`${SOURCE_SHA}\`"
            echo "- Bump level: \`${RELEASE_LEVEL}\`"
            echo "- Version: \`${NEXT_VERSION}\`"
            echo "- Tag: \`${RELEASE_TAG}\`"
            echo "- Image digest: \`${DIGEST}\`"
            if [ "${IS_MAINTENANCE_CUT}" = "true" ]; then
              echo "- Maintenance cut: built from \`${SOURCE_BRANCH}\`, not \`main\` — no SLSA build-provenance attestation (see \"Defect 3\" comment in this workflow); cosign signature only."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
