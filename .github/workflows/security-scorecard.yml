name: "Security: OpenSSF Scorecard"
run-name: >-
  ${{
    github.event_name == 'branch_protection_rule' && 'Security: OpenSSF Scorecard — Branch protection changed' ||
    github.event_name == 'schedule' && 'Security: OpenSSF Scorecard — Weekly schedule' ||
    github.event_name == 'workflow_dispatch' && format('Security: OpenSSF Scorecard — Manual by {0}', github.actor) ||
    format('Security: OpenSSF Scorecard — {0}', github.ref_name)
  }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
  branch_protection_rule:
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 06:00 UTC

permissions: read-all

concurrency:
  group: scorecard-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  analysis:
    name: "Security: Scorecard Analysis"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read  # Allow SARIF upload metadata reads on private repos
      checks: read  # Improve CI/SAST detection on private repos
      contents: read  # Checkout code
      issues: read  # Improve maintainer/activity checks on private repos
      pull-requests: read  # Improve commit/review checks on private repos
      security-events: write  # Upload SARIF results
      id-token: write  # Publish results to OpenSSF REST API

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        timeout-minutes: 15
        with:
          results_file: results.sarif
          results_format: sarif
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}
          publish_results: true

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          sarif_file: results.sarif
