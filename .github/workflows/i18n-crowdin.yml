name: "🌐 i18n: Crowdin Sync"

on:
  push:
    # Source strings live on the integration branch. main only advances by
    # merging from dev/vX.Y before a cut, so uploading from main would lag a
    # release behind and the returning translation PR would land on a branch
    # that is not supposed to take independent commits.
    branches: ['dev/**', main]
    paths:
      - 'README.md'
      - 'ui/src/locales/en/**'
      - 'crowdin.yml'
      - '.github/workflows/i18n-crowdin.yml'
  schedule:
    - cron: '0 7 * * 1'   # Mondays 07:00 UTC — pull translations weekly
  workflow_dispatch:

concurrency:
  group: crowdin-sync
  cancel-in-progress: false

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: crowdin
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the integration branch to open the translation PR against
        id: base
        run: |
          set -euo pipefail
          # Highest dev/vX.Y on origin, sorted numerically so dev/v1.10 beats
          # dev/v1.9. Falls back to the default branch during the window between
          # a GA and the next dev branch being cut, so translations are never
          # stranded with nowhere to land.
          #
          # The grep is guarded: with `pipefail` a no-match grep exits 1 and
          # aborts the assignment, which killed the fallback below before it
          # could ever run (2026-07-24, when the sync PR merge briefly deleted
          # dev/v1.6). A failing ls-remote still propagates, so a network or
          # auth error fails loudly instead of silently retargeting main.
          base="$(git ls-remote --heads origin 'refs/heads/dev/v*' \
            | sed 's#.*refs/heads/##' \
            | { grep -E '^dev/v[0-9]+\.[0-9]+$' || true; } \
            | sort -t/ -k2 -V \
            | tail -1)"
          if [ -z "${base}" ]; then
            base="${DEFAULT_BRANCH}"
            echo "No dev/vX.Y branch on origin — falling back to ${base}."
          fi
          echo "name=${base}" >> "$GITHUB_OUTPUT"
          echo "Translation PRs will target ${base}."
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

      - name: Check out the integration branch so l10n_crowdin forks from it
        env:
          BASE: ${{ steps.base.outputs.name }}
        run: |
          set -euo pipefail
          # The checkout above pinned HEAD to the triggering ref, which is main
          # whenever a sync merge touches locale files. The crowdin action forks
          # l10n_crowdin from HEAD, so without this switch the translation PR
          # carries main's squash history and shows as permanently conflicting
          # against the dev base (bit #601 and #618).
          git fetch origin "refs/heads/${BASE}:refs/remotes/origin/${BASE}"
          git checkout -B "${BASE}" "refs/remotes/origin/${BASE}"

      - name: Mint an App installation token for the translation PR
        id: app-token
        # `can_approve_pull_request_reviews` is false org-wide and repo-wide, and
        # that control blocks GITHUB_TOKEN from CREATING pull requests, not just
        # approving them — the crowdin step 403'd with "GitHub Actions is not
        # permitted to create or approve pull requests" while still pushing the
        # branch fine, so translations landed on l10n_crowdin and stopped there.
        # The setting stays false (a workflow that can approve its own PRs
        # defeats the two-approver rule); the fix is a dedicated identity.
        # Chosen over a PAT for lifetime, not permissions. The App's stored
        # credentials (id + private key) don't expire, so this can't silently
        # re-break a year from now the way a PAT would. The token they mint is
        # deliberately short-lived: fresh per run, dead in an hour.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.CROWDIN_APP_ID }}
          private-key: ${{ secrets.CROWDIN_APP_PRIVATE_KEY }}
          # Narrow at mint time, not just at the App's install grants. Without
          # these the token carries whatever the installation happens to hold,
          # so broadening the App later would silently widen this workflow too.
          # These two are exactly what the crowdin step needs: push l10n_crowdin
          # and open the PR.
          permission-contents: write
          permission-pull-requests: write

      - uses: crowdin/github-action@c7af9bc98b01694653031fef2a0dc6c7888ce9bc  # v2.17.0
        with:
          user: auto
          upload_sources: true
          upload_translations: true
          download_translations: true
          localization_branch_name: l10n_crowdin
          create_pull_request: true
          pull_request_title: "chore(i18n): sync translations from Crowdin"
          pull_request_body: "Automated sync from Crowdin. Review wording, then merge."
          pull_request_labels: "translations,crowdin"
          pull_request_base_branch_name: ${{ steps.base.outputs.name }}
          commit_message: "chore(i18n): sync translations from Crowdin"
        env:
          # The crowdin/github-action entrypoint runs `git config --global`
          # (safe.directory, then the commit user) but the container inherits
          # HOME=/ from the runner, so those writes hit "could not lock config
          # file //.gitconfig: Permission denied" and the commit/PR step fails.
          # A step-level HOME can't fix it: GitHub passes HOME to container
          # actions via `-e HOME` pass-through, which always wins. Instead point
          # git's global config at a mounted, writable file — GIT_CONFIG_GLOBAL
          # is honored independent of HOME (git >= 2.32).
          GIT_CONFIG_GLOBAL: /github/home/.gitconfig
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
