# A dev -> main sync squash carries sub-PR text, and a "Fixes: #N" in it closes
# an issue that was reopened on purpose (#565 was closed again by three syncs).
# This fails a PR into main whose title, body or commit messages hold a GitHub
# closing keyword (the commits build the squash message).
# A sync PR head has main as its first parent, so BASE..HEAD would walk all of
# dev; there the guard scans only the sync commit's own message.
# `edited` re-runs it when the body is rewritten to clear the finding. Not a
# required check, so it adds no required context on main.
name: Closing Keywords Guard

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  closing-keywords:
    name: "Guard: Closing keywords"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Fail on closing keywords in the PR title, body or commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s\n' "${PR_TITLE}" > "${RUNNER_TEMP}/pr-title.txt"
          printf '%s\n' "${PR_BODY}" > "${RUNNER_TEMP}/pr-body.txt"
          # A dev -> main sync head is a merge whose first parent is the PR base.
          # BASE..HEAD would then walk every dev commit since the branch cut, so
          # scan only the sync commit's own message.
          head_parents="$({ git rev-list --parents -n 1 "${HEAD_SHA}" || true; })"
          read -r -a head_parts <<< "${head_parents}"
          first_parent="$({ git rev-parse "${HEAD_SHA}^1" 2>/dev/null || true; })"
          if [ "${#head_parts[@]}" -gt 2 ] && [ "${first_parent}" = "${BASE_SHA}" ]; then
            git log -1 --format=%B "${HEAD_SHA}" > "${RUNNER_TEMP}/pr-commits.txt"
          else
            git log --format=%B "${BASE_SHA}..${HEAD_SHA}" > "${RUNNER_TEMP}/pr-commits.txt"
          fi
          node scripts/closing-keywords.mjs \
            "PR title=${RUNNER_TEMP}/pr-title.txt" \
            "PR body=${RUNNER_TEMP}/pr-body.txt" \
            "PR commits=${RUNNER_TEMP}/pr-commits.txt"
