# Credentials are supplied by the Crowdin GitHub Action via repo secrets
# (CROWDIN_PROJECT_ID, CROWDIN_PERSONAL_TOKEN), not committed here.
project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
base_path: .
preserve_hierarchy: true

commit_message: "i18n: sync %language% translations from Crowdin"
append_commit_message: false
pull_request_title: "i18n: sync translations from Crowdin"
pull_request_labels:
  - translations
  - crowdin

files:
  - source: /ui/src/locales/en/**/*.json
    translation: /ui/src/locales/%locale%/**/%original_file_name%
    languages_mapping:
      locale:
        ar: ar
        de: de
        es-ES: es
        fr: fr
        it: it
        ja: ja
        ko: ko
        nl: nl
        pl: pl
        pt-BR: pt-BR
        ru: ru
        tr: tr
        uk: uk
        vi: vi
        zh-CN: zh-CN
        zh-TW: zh-TW
    update_option: update_as_unapproved
# README.md is deliberately NOT in this list. The six translated READMEs are
# hand-authored in-repo and asserted phrase by phrase by
# .github/tests/readme-translations.test.ts, including release-specific bullets
# that are rewritten at every cut. Crowdin can only round-trip them, and the
# round trip has never been lossless:
#
#   - Segmentation was the first failure. The default content_segmentation: 1
#     split the README into sentence segments and routed the upload through
#     what Crowdin calls "experimental machine learning technology", which
#     reassembled the <details>/<summary> release-history blocks in the wrong
#     order, broke HTML tags, and spliced English into the de and zh-CN output.
#     Setting it to 0 (#804) took the file from 446 sentence segments to 382
#     block ones and fixed the corruption.
#   - Orphaning was the second. Flipping segmentation renumbered every segment,
#     so the stored translations no longer matched any of them. The export then
#     falls back to source text: PR #919 reverted all six translated READMEs to
#     English in a single sync (1392 deletions), caught only because
#     readme-translations.test.ts failed 30 assertions.
#
# `upload_translations: true` cannot dig out of that, because re-uploading a
# clean README.<locale>.md only adds a new unapproved candidate alongside the
# stored one. The purge job in .github/workflows/i18n-crowdin.yml exists for
# that and still works if these files ever go back into Crowdin, but there is
# no reason to put them back: nobody translates the README in Crowdin, the repo
# is where they are actually maintained, and the only thing the mapping
# produced was a recurring PR that reverts them.
#
# The UI locale JSON above stays in Crowdin and is unaffected. Segmentation
# does not apply to JSON, which is what identified the cause in the first place.
