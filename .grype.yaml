# Grype configuration — drydock container image scan triage.
#
# The grype-image job (.github/workflows/security-grype.yml) fails the build on
# HIGH/CRITICAL. These ignore rules scope that gate to the dependencies drydock
# actually controls — the Node runtime, the Alpine OS packages, and the app
# (npm) dependency graph — and exclude the vendored Go module graphs compiled
# into the third-party `cosign` and `trivy` CLI binaries the image ships for
# signature verification and container scanning.
#
# Why: those CVEs (golang.org/x/crypto, x/net, Go stdlib, …) live inside upstream
# tool binaries, not drydock's own code, and reach the binary only as cosign's /
# trivy's vendored modules. We cannot patch them independently — they clear only
# when upstream releases a rebuilt Trivy image or Alpine rebuilds Cosign, which we
# pick up by bumping the pinned Trivy image index or Alpine package (the cosign
# 2.6.3-r1 -> 3.0.6-r1 bump already cleared the bulk of them). Gating the build
# on a module graph we don't control is the same manifest-vs-shipped mismatch we
# dropped Snyk over. The Node runtime, musl, git, and every other OS package
# (curl was removed from the image in v1.7.0) — plus the entire app dependency
# graph — stay fully gated, confirmed by the scan, which after the base bump
# leaves residual HIGH/CRITICAL findings only at these two binary locations.
#
# Revisit on each pinned-tool or base-image bump: fixed upstream binaries make
# these scopes stop matching anything.
#
# CVE-2026-14456 (openssl / libssl3 / libcrypto3, Alpine 3.24, all at 3.5.7-r0):
# CWE-770 unbounded memory growth in OpenSSL's QUIC *server* incoming-channel-
# queue handling, fixed upstream in 3.5.8/3.6.4/4.0.2. As of 2026-08-19, no
# Alpine branch has repackaged it — 3.24-stable and edge aports both still pin
# openssl at 3.5.7-r0, and grype's own DB carries fix.state: unknown — so there
# is no version to bump to yet. The gate scores it High off the generic CVSS
# 3.1 vector (AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H, 7.5); OpenSSL's own advisory
# rates it Low, because it only bites a QUIC server accepting unauthenticated
# Initial packets. Drydock links libssl3/libcrypto3 through the openssl CLI
# and Node's own TLS stack as TLS *clients* only — registry queries and the
# healthcheck — and runs no QUIC/HTTP3 server anywhere, so the vulnerable code
# path is not reachable here regardless of the CVSS bucket. (curl was removed
# from the image in v1.7.0 and is no longer part of that TLS-client surface.)
#
# Scoped to this exact CVE on these three package names (not by location), so
# a different HIGH/CRITICAL finding in openssl/libssl3/libcrypto3 still fails
# the gate normally.
#
# Remove this entry when either fires first:
#   1. Alpine ships openssl >= 3.5.8 for the 3.24 branch (bump the Dockerfile's
#      pinned `openssl=` version and drop this block — the `apk upgrade` line
#      already covers libssl3/libcrypto3 once a rebuilt package exists).
#   2. 2026-11-17 (90 days out) — recheck regardless, so this can't sit past a
#      quarter if the version bump goes unnoticed.
ignore:
  - package:
      location: "/usr/bin/cosign"
  - package:
      location: "/usr/local/bin/trivy"
  - vulnerability: CVE-2026-14456
    package:
      name: openssl
  - vulnerability: CVE-2026-14456
    package:
      name: libssl3
  - vulnerability: CVE-2026-14456
    package:
      name: libcrypto3
