# Grype configuration — drydock container image scan triage.
#
# The grype-image job (.github/workflows/security-grype.yml) and the PR-built image scan in
# ci-verify.yml fail the build on HIGH/CRITICAL. This file carries no ignore rules: the image
# ships the Node runtime, the Alpine OS packages, the app (npm) dependency graph, and the
# healthcheck binary, and every one of those stays fully gated.
#
# Trivy and cosign used to live in the image as vendored Go binaries, and their module graphs
# (golang.org/x/crypto, x/net, Go stdlib, ...) produced findings drydock could not patch
# independently, so earlier revisions of this file ignored the two binary locations. Both tools
# now run from pinned worker images instead (DD_SECURITY_BACKEND=auto, see
# app/configuration/index.ts), so there is nothing left to scope out.
#
# Rules for adding an entry back: scope it by CVE and package name, never by location, and say
# in a comment which upstream release clears it, so the entry can be deleted when the fix lands.
# An ignore that matches nothing should be removed.
#
# CVE-2026-14456 (openssl / libssl3 / libcrypto3) was ignored here from 2026-08-19 until the
# Dockerfile's `openssl=` pin rolled to 3.5.8-r0 (#881), which carries the upstream fix. A live
# grype scan of that exact pin confirms zero matches, so the suppression was removed.

# Exact-package OpenVEX evidence for optional infback9 code absent from the runtime.
# not_affected findings move to JSON ignoredMatches and are omitted from SARIF.
# No ignore rules or severity cutoffs change.
# Reassess if the package revision or build recipe changes.
vex-documents:
  - docker/zlib-infback9.vex.json
