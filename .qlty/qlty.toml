# Try Qlty Cloud: https://qlty.sh
#
# For a guide to configuration, visit https://qlty.sh/d/config
# Or for a full reference, visit https://qlty.sh/d/qlty-toml
config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/*.d.ts",
  "**/.yarn/**",
  "**/bower_components/**",
  "**/build/**",
  "**/coverage/**",
  "**/cache/**",
  "**/dist/**",
  "**/generated/**",
  "**/node_modules/**",
  "**/target/**",
  "**/testdata/**",
  "**/vendor/**",
  ".qlty/out/**",
  ".qlty/logs/**",
  ".qlty/results/**",
  ".qlty/plugin_cachedir/**",
  ".playwright-cli/**",
  ".claude/**",
  "output/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

# Disabled: guard clauses, switch dispatches, and icon/color maps produce many returns by design
[smells.return_statements]
enabled = false

# Disabled: core domain files (watchers, triggers, API routes) are inherently complex;
# splitting them would hurt cohesion without improving readability
[smells.file_complexity]
enabled = false

[[source]]
name = "default"
default = true

[[plugin]]
name = "actionlint"

[[plugin]]
name = "checkov"

[[plugin]]
name = "dockerfmt"

[[plugin]]
name = "hadolint"

[[plugin]]
name = "markdownlint"
mode = "comment"
# Pinned so the markdownlint ruleset is identical locally and in CI. Left
# unpinned, qlty resolves whatever markdownlint the installed CLI defaults to,
# which drifts between a developer's qlty and CI's (latest) qlty — a doc that
# passed `qlty check --all` locally then failed the CI lint gate on MD032.
version = "0.46.0"

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "radarlint-iac"
mode = "monitor"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "shellcheck"
# Pinned to the version GitHub Actions ubuntu-latest pre-installs.
# qlty otherwise resolves to the latest (0.11.0) and rejects the runner's
# 0.9.0 binary with "Invalid tool version", failing the lint job.
version = "0.9.0"

[[plugin]]
name = "shfmt"

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "yamllint"

# checkov CKV_SECRET_6 fires on any JSON key containing "apiKey" whose value has
# base64-like entropy; the Dutch UI catalog's "API-sleutels" label trips it while
# the other sixteen translations of the same key do not. These are translated UI
# strings, not credentials, and every locale carries the key by design. checkov's
# other checks target IaC, so excluding the plugin from the catalogs loses nothing;
# gitleaks and trufflehog still scan them for real secrets.
[[exclude]]
file_patterns = ["ui/src/locales/**"]
plugins = ["checkov"]

# markdownlint table style is low-signal for this repository's docs format
[[triage]]
match.rules = ["markdownlint:MD060"]
set.ignored = true

# next@16.2.2 — no patch available as of 2026-04-02; latest stable is affected
[[triage]]
match.rules = ["osv-scanner:CVE-2025-59472"]
set.ignored = true

# js-yaml@3.14.2 via artillery (e2e load-testing only). The only fix is js-yaml 4.2.0,
# which removes safeLoad() that artillery@2.0.32 calls (artillery/lib/util.js) — a
# breaking change. The DoS (quadratic merge-key parsing) is unreachable: artillery
# parses only trusted, in-repo load-test configs. Test-only dep; not shipped.
[[triage]]
match.rules = ["osv-scanner:CVE-2026-53550"]
set.ignored = true

# checkov CKV_GHA_7 asserts "workflow_dispatch inputs MUST be empty" and fires on
# the mere presence of any input — confirmed against a controlled probe, where all
# four of required/optional x with/without-default trip it identically. Its premise
# is that build output must not be influenced by user parameters, which does not
# hold for a manually dispatched pipeline: release-cut.yml takes release_tag,
# candidate_tag, candidate_digest and soak_override_reason, and cutting a release
# is exactly the operation those are meant to steer. Dispatching requires write
# access, so the "user" here is a maintainer, not an anonymous caller.
#
# Suppressed globally rather than per-file because qlty triage matches on rule id.
# The real guard on dispatch inputs is that each consuming workflow validates them
# (release-cut.yml asserts the tag base matches package.json and that the tag does
# not already exist; the i18n purge job requires an exact confirm string and bounds
# what it will touch). Adding a dispatch input is not made safe by this entry —
# validate it in the workflow.
[[triage]]
match.rules = ["checkov:CKV_GHA_7"]
set.ignored = true
